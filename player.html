<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>115年鄉鎮市考核 簡報播放器</title>
<style>
:root{--bg:#0E1416;--panel:#172126;--line:#26343A;--fg:#EEF3F2;--muted:#93A4A6;--acc:#3FBF8F;--warn:#F2B33D;--over:#F0524A;
  --font:"Microsoft JhengHei","Noto Sans TC","PingFang TC",system-ui,sans-serif;--mono:"Consolas","IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
#menu{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:28px 16px}
#menu h1{margin:0;font-size:clamp(24px,3vw,40px);text-align:center}
#menu p{margin:0;color:var(--muted);text-align:center;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;width:min(1200px,100%)}
.grid button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px 20px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:left}
.grid button:hover{border-color:var(--acc)}
.grid button .n{font-family:var(--mono);color:var(--muted);font-size:15px}
.grid button .t{font-size:26px;font-weight:900;letter-spacing:.04em}
.grid button .s{font-size:14px;color:var(--muted)}
.grid button.none{opacity:.45}
.grid button.cur{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--panel))}
.foot{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:14px}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--muted);margin-right:.35em}
.dot.on{background:var(--acc)}
#play{position:fixed;inset:0;background:#000;display:none}
#play.on{display:block}
#play img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
#play .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(22px,3vw,44px);color:#cfd8d6;line-height:1.7}
#play .empty b{display:block;font-size:1.5em;color:#fff}
.media{position:absolute;left:50%;top:2vh;transform:translateX(-50%);background:var(--warn);color:#2A1C00;font-weight:700;padding:.35em 1em;border-radius:999px;font-size:18px}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transition:opacity .25s}
.bar.show{opacity:1}
.bar button{padding:10px 18px;border-radius:10px;border:1px solid #3A4A4F;background:rgba(23,33,38,.9);font-size:17px}
.bar .pg{font-family:var(--mono);font-size:18px;min-width:7em;text-align:center}
.bar .tn{font-weight:900;font-size:18px;margin-right:8px}
.toast{position:fixed;left:50%;top:10vh;transform:translateX(-50%);background:rgba(10,16,17,.92);color:#fff;padding:.7em 1.4em;border-radius:12px;font-size:20px;font-weight:700;z-index:9;border:1px solid #33413F}
.toast[hidden]{display:none}
</style>
</head>
<body>
<section id="menu">
  <h1>115年鄉鎮市考核　簡報播放器</h1>
  <p>點公所名稱就開始播放（自動全螢幕）。翻頁用鍵盤左右鍵、PageUp／PageDown 或簡報筆。<br>播放中按 M 回到這個選單；全螢幕時長按 Esc 才會離開。</p>
  <div class="grid" id="grid"></div>
  <div class="foot"><span><i class="dot" id="netDot"></i><span id="netTx">會場連線中…</span></span><span>影片頁（竹山鎮）請用「備案_原始簡報」資料夾的 PowerPoint 播放</span></div>
</section>
<section id="play" aria-label="簡報播放">
  <div id="stage"></div>
  <div class="bar" id="bar">
    <span class="tn" id="bTown"></span>
    <button type="button" id="bMenu">選單（M）</button>
    <button type="button" id="bPrev" aria-label="上一頁">◀</button>
    <span class="pg" id="bPg">—</span>
    <button type="button" id="bNext" aria-label="下一頁">▶</button>
    <button type="button" id="bFs">全螢幕</button>
  </div>
</section>

<script>
/* 115年鄉鎮市考核會場連線（主控台、計時器、簡報播放器、委員儀表板共用）
   - 經公開 MQTT 中繼（WebSocket）同時連多個伺服器，訊息去重，任一台通即可。
   - 不需登入、不需帳號；斷網時各系統照常獨立運作。
   - 同一台電腦的視窗另用 BroadcastChannel 互通（不需網路）。 */
window.VENUE=(function(){
  const SITE="ndnb7hg6ad1l";
  const PREFIX="nt115v/"+SITE+"/";
  const BROKERS=(window.VENUE_BROKERS||[
    "wss://broker.emqx.io:8084/mqtt",
    "wss://broker.hivemq.com:8884/mqtt",
    "wss://test.mosquitto.org:8081/mqtt"
  ]);
  const enc=new TextEncoder(), dec=new TextDecoder();
  const subs=[];               // {filter, fn}
  const conns=[];
  const seen=new Map();        // 訊息去重
  let statusFn=()=>{}, will=null, started=false;
  let bc=null; try{ bc=new BroadcastChannel("nt115v-"+SITE); bc.onmessage=e=>deliver(e.data.t,e.data.p,"bc"); }catch(e){}

  const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  function str(s){const b=enc.encode(s); return [b.length>>8,b.length&255,...b];}
  function remLen(n){const o=[]; do{let d=n%128; n=Math.floor(n/128); if(n>0)d|=128; o.push(d);}while(n>0); return o;}
  function packet(type,body){return new Uint8Array([type,...remLen(body.length),...body]);}
  function match(filter,topic){
    const f=filter.split("/"), t=topic.split("/");
    for(let i=0;i<f.length;i++){ if(f[i]==="#") return true; if(f[i]!=="+"&&f[i]!==t[i]) return false; }
    return f.length===t.length;
  }
  function deliver(topic,payload,src){
    let obj; try{ obj=typeof payload==="string"?JSON.parse(payload):payload; }catch(e){ return; }
    if(obj&&obj._id){ const k=topic+"|"+obj._id; if(seen.has(k)) return; seen.set(k,Date.now());
      if(seen.size>500){ const cut=Date.now()-600000; for(const [kk,v] of seen) if(v<cut) seen.delete(kk); } }
    for(const s of subs) if(match(s.filter,topic)) try{ s.fn(obj,topic.slice(PREFIX.length)); }catch(e){ console.error(e); }
  }
  function Conn(url){
    const c={url,ws:null,ok:false,buf:new Uint8Array(0),ping:0,retry:0,pid:1};
    c.open=()=>{
      try{ c.ws=new WebSocket(url,"mqtt"); }catch(e){ return c.later(); }
      c.ws.binaryType="arraybuffer";
      const to=setTimeout(()=>{ try{c.ws.close()}catch(e){} },8000);
      c.ws.onopen=()=>{
        let flags=0x02, pay=str("nt115-"+rid());
        if(will){ flags|=0x04|0x20; pay=pay.concat(str(PREFIX+will.topic), str(JSON.stringify(will.obj))); }
        const vh=[...str("MQTT"),4,flags,0,30];
        c.ws.send(packet(0x10,vh.concat(pay)));
      };
      c.ws.onmessage=e=>{ clearTimeout(to); c.feed(new Uint8Array(e.data)); };
      c.ws.onclose=()=>{ clearTimeout(to); const was=c.ok; c.ok=false; clearInterval(c.ping); if(was) report(); c.later(); };
      c.ws.onerror=()=>{};
    };
    c.later=()=>{ c.retry=Math.min(c.retry+1,6); setTimeout(c.open,1000*Math.min(30,2**c.retry)); };
    c.feed=data=>{
      const b=new Uint8Array(c.buf.length+data.length); b.set(c.buf); b.set(data,c.buf.length); c.buf=b;
      while(c.buf.length>=2){
        let mul=1,len=0,i=1,byte;
        do{ if(i>=c.buf.length) return; byte=c.buf[i++]; len+=(byte&127)*mul; mul*=128; }while(byte&128);
        if(c.buf.length<i+len) return;
        const hdr=c.buf[0], type=hdr>>4, body=c.buf.slice(i,i+len); c.buf=c.buf.slice(i+len);
        if(type===2){ if(body[1]===0){ c.ok=true; c.retry=0; c.subscribeAll(); c.ping=setInterval(()=>{try{c.ws.send(new Uint8Array([0xC0,0]))}catch(e){}},20000); report(); if(c.onup) c.onup(); } }
        else if(type===3){ const tl=(body[0]<<8)|body[1]; const topic=dec.decode(body.slice(2,2+tl)); let p=2+tl; if(hdr&6) p+=2; deliver(topic,dec.decode(body.slice(p)),"mqtt"); }
      }
    };
    c.subscribe=filter=>{ if(!c.ok) return; const id=c.pid++&65535||1; c.ws.send(packet(0x82,[id>>8,id&255,...str(PREFIX+filter),0])); };
    c.subscribeAll=()=>{ const done=new Set(); for(const s of subs){ if(done.has(s.raw)) continue; done.add(s.raw); c.subscribe(s.raw); } };
    c.publish=(topic,payload,retain)=>{ if(!c.ok) return false; try{ c.ws.send(packet(0x30|(retain?1:0),[...str(PREFIX+topic),...enc.encode(payload)])); return true; }catch(e){ return false; } };
    return c;
  }
  function report(){ statusFn(conns.filter(c=>c.ok).length, conns.length); }
  let upFns=[];
  return {
    site:SITE,
    start(opts){ if(started) return; started=true; opts=opts||{}; will=opts.will||null; if(opts.onStatus) statusFn=opts.onStatus;
      if(opts.onUp) upFns.push(opts.onUp);
      for(const u of BROKERS){ const c=Conn(u); c.onup=()=>upFns.forEach(f=>f()); conns.push(c); c.open(); } report(); },
    onStatus(fn){ statusFn=fn; report(); },
    onUp(fn){ upFns.push(fn); },
    connected(){ return conns.filter(c=>c.ok).length; },
    sub(filter,fn){ subs.push({filter:PREFIX+filter,raw:filter,fn}); for(const c of conns) c.subscribe(filter); },
    pub(topic,obj,retain){ const o=Object.assign({},obj,{_id:rid(),_ts:Date.now()}); const p=JSON.stringify(o);
      let n=0; for(const c of conns) if(c.publish(topic,p,retain)) n++;
      try{ bc&&bc.postMessage({t:PREFIX+topic,p:o}); }catch(e){}
      return n; }
  };
})();

</script>
<script>
const TOWNS=window.BOARD_DATA.towns.map(t=>t.name);
const SL=window.BOARD_SLIDES||{};
const $=id=>document.getElementById(id);
const pad3=n=>String(n).padStart(3,"0");
const src=(i,n)=>"slides/"+encodeURIComponent(TOWNS[i])+"/"+pad3(n)+".jpg";
const P={view:"menu",town:-1,page:0,pages:0};
const pagesCache={};
function countPages(i){
  const m=SL[TOWNS[i]]; if(m&&m.pages) return Promise.resolve(m.pages);
  if(pagesCache[i]!=null) return Promise.resolve(pagesCache[i]);
  return new Promise(res=>{ let n=0; const next=()=>{const im=new Image(); im.onload=()=>{n++; n>=300?done():next();}; im.onerror=done; im.src=src(i,n+1);}; const done=()=>{pagesCache[i]=n;res(n);}; next(); });
}
function buildMenu(){
  $("grid").innerHTML=TOWNS.map((t,i)=>{ const m=SL[t]; return `<button type="button" data-i="${i}" class="${m?"":"none"}"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${t}</span><span class="s">${m?m.pages+" 頁"+(m.media&&m.media.length?"・含影片頁":""):"尚未提供（有放進資料夾會自動讀取）"}</span></button>`; }).join("");
  $("grid").querySelectorAll("button").forEach(b=>b.onclick=()=>{ enterFs(); openTown(+b.dataset.i); });
}
let tok=0;
function openTown(i){
  if(!(i>=0&&i<TOWNS.length)) return;
  P.view="play"; P.town=i; P.page=0; P.pages=0; const my=++tok;
  $("menu").hidden=true; $("play").classList.add("on"); $("bTown").textContent=TOWNS[i];
  $("stage").innerHTML=`<div class="empty">載入中…</div>`; markMenu(); push();
  countPages(i).then(n=>{ if(my!==tok) return; P.pages=n;
    if(!n){ $("stage").innerHTML=`<div class="empty"><b>${TOWNS[i]}</b>本所簡報尚未提供<br>請改用原始檔播放，或按 M 回選單</div>`; $("bPg").textContent="0 / 0"; push(); return; }
    show(1); for(let k=1;k<=n;k++){const im=new Image(); im.decoding="async"; im.src=src(i,k);} });
}
function show(n){
  if(!P.pages) return; n=Math.max(1,Math.min(P.pages,n)); P.page=n;
  const media=(SL[TOWNS[P.town]]?.media||[]).includes(n);
  $("stage").innerHTML=`<img alt="${TOWNS[P.town]}簡報第${n}頁" src="${src(P.town,n)}">`+(media?`<div class="media">此頁含影片：請改用「備案_原始簡報」以 PowerPoint 播放這一頁</div>`:"");
  $("bPg").textContent=`${n} / ${P.pages}`; push();
}
function toMenu(){ P.view="menu"; tok++; $("play").classList.remove("on"); $("menu").hidden=false; markMenu(); push(); }
function markMenu(){ $("grid").querySelectorAll("button").forEach((b,k)=>b.classList.toggle("cur",k===P.town)); }
/* 全螢幕：長按 Esc 才離開（支援鍵盤鎖定的瀏覽器） */
let fsLocked=false;
async function enterFs(){ if(document.fullscreenElement) return;
  try{ await document.documentElement.requestFullscreen({navigationUI:"hide"}); }catch(e){ return toast("這台電腦無法自動全螢幕，請按 F11"); }
  fsLocked=false; try{ if(navigator.keyboard&&navigator.keyboard.lock){ await navigator.keyboard.lock(["Escape"]); fsLocked=true; } }catch(e){} }
document.addEventListener("fullscreenchange",()=>{ $("bFs").textContent=document.fullscreenElement?"全螢幕中":"全螢幕"; if(!document.fullscreenElement){ try{navigator.keyboard&&navigator.keyboard.unlock()}catch(e){} } });
let tt=0; function toast(m){ const el=$("toast"); el.textContent=m; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,3500); }
$("bMenu").onclick=toMenu; $("bPrev").onclick=()=>show(P.page-1); $("bNext").onclick=()=>show(P.page+1); $("bFs").onclick=()=>{ if(document.fullscreenElement) toast(fsLocked?"長按 Esc 鍵即可離開全螢幕":"按 Esc 鍵離開全螢幕"); else enterFs(); };
let bt=0; addEventListener("mousemove",()=>{ $("bar").classList.add("show"); clearTimeout(bt); bt=setTimeout(()=>$("bar").classList.remove("show"),2500); });
$("play").addEventListener("click",e=>{ if(e.target.closest(".bar")) return; show(P.page+1); });
addEventListener("keydown",e=>{
  if(e.ctrlKey||e.altKey||e.metaKey) return; const k=e.key;
  if(P.view!=="play"){ if(k==="f"||k==="F") enterFs(); return; }
  if(["ArrowRight","PageDown"," ","Enter","ArrowDown"].includes(k)){e.preventDefault();show(P.page+1);}
  else if(["ArrowLeft","PageUp","Backspace","ArrowUp"].includes(k)){e.preventDefault();show(P.page-1);}
  else if(k==="Home"){e.preventDefault();show(1);} else if(k==="End"){e.preventDefault();show(P.pages);}
  else if(k==="m"||k==="M") toMenu(); else if(k==="f"||k==="F") enterFs();
});
addEventListener("wheel",e=>{ if(P.view!=="play") return; const now=Date.now(); if(now-(window._w||0)<350) return; window._w=now; show(P.page+(e.deltaY>0?1:-1)); },{passive:true});
/* 會場連線：回報播放狀態、接受主控台指令 */
let pt=0; function push(){ clearTimeout(pt); pt=setTimeout(()=>{ if(window.VENUE) VENUE.pub("player/state",{online:true,view:P.view,town:P.town,name:P.town>=0?TOWNS[P.town]:"",page:P.page,pages:P.pages},true); },200); }
if(window.VENUE){
  VENUE.start({will:{topic:"player/state",obj:{online:false}},onUp:push,onStatus:n=>{ $("netDot").classList.toggle("on",n>0); $("netTx").textContent=n>0?"已連上會場連線（主控台可遙控）":"未連上會場連線：本機照常播放"; }});
  setInterval(push,20000);
  VENUE.sub("player/cmd",c=>{ if(!c) return;
    if(c.a==="town") openTown(+c.v); else if(c.a==="page") show(+c.v); else if(c.a==="next") show(P.page+1); else if(c.a==="prev") show(P.page-1); else if(c.a==="menu") toMenu(); });
}
buildMenu();
</script>
